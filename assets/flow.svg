<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="The redesign-director flow: 0 Orient, 1 Map, 2 Foundations, 3 Mockups, 4 States, 5 Evidence (opt-in), 6 Revise, 7 ADRs, 8 Iterate — looping back with the user.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="-10%" r="80%">
      <stop offset="0" stop-color="#123449"/>
      <stop offset="1" stop-color="#0A1320"/>
    </radialGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#2DD4BF" stroke-width="1.4"/>
    </marker>
    <marker id="arwB" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#C99645" stroke-width="1.4"/>
    </marker>
    <style>
      .num{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;text-anchor:middle;dominant-baseline:central}
      .name{fill:#EAF3F4;font:600 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-anchor:middle}
      .desc{fill:#93A4B3;font:11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-anchor:middle}
      .title{fill:#EAF3F4;font:700 15px system-ui,sans-serif;letter-spacing:2.5px}
      .tag{fill:#2DD4BF;font:600 13px system-ui,sans-serif;text-anchor:end}
      .foot{fill:#93A4B3;font:12px system-ui,sans-serif;text-anchor:middle}
      .loop{fill:#C99645;font:600 11px system-ui,sans-serif;text-anchor:middle;letter-spacing:.5px}
    </style>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>
  <text class="title" x="70" y="48">REDESIGN-DIRECTOR</text>
  <text class="tag" x="1210" y="48">the redesign flow</text>

  <!-- connectors -->
  <g stroke="#2DD4BF" stroke-opacity="0.32" stroke-width="2" marker-end="url(#arw)">
    <line x1="92"  y1="118" x2="189"  y2="118"/>
    <line x1="235" y1="118" x2="331"  y2="118"/>
    <line x1="377" y1="118" x2="474"  y2="118"/>
    <line x1="520" y1="118" x2="616"  y2="118"/>
    <line x1="662" y1="118" x2="759"  y2="118"/>
    <line x1="805" y1="118" x2="901"  y2="118"/>
    <line x1="947" y1="118" x2="1044" y2="118"/>
    <line x1="1090" y1="118" x2="1186" y2="118"/>
  </g>

  <!-- nodes -->
  <!-- 0 Orient -->
  <circle cx="70"   cy="118" r="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="2"/>
  <text class="num" x="70"   y="118" fill="#2DD4BF">0</text>
  <text class="name" x="70"   y="166">Orient</text>
  <text class="desc" x="70"   y="184">branch + core</text>
  <!-- 1 Map -->
  <circle cx="213"  cy="118" r="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="2"/>
  <text class="num" x="213"  y="118" fill="#2DD4BF">1</text>
  <text class="name" x="213"  y="166">Map</text>
  <text class="desc" x="213"  y="184">screens &amp; IA</text>
  <!-- 2 Foundations -->
  <circle cx="355"  cy="118" r="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="2"/>
  <text class="num" x="355"  y="118" fill="#2DD4BF">2</text>
  <text class="name" x="355"  y="166">Foundations</text>
  <text class="desc" x="355"  y="184">tokens + thesis</text>
  <!-- 3 Mockups -->
  <circle cx="498"  cy="118" r="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="2"/>
  <text class="num" x="498"  y="118" fill="#2DD4BF">3</text>
  <text class="name" x="498"  y="166">Mockups</text>
  <text class="desc" x="498"  y="184">HTML per screen</text>
  <!-- 4 States -->
  <circle cx="640"  cy="118" r="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="2"/>
  <text class="num" x="640"  y="118" fill="#2DD4BF">4</text>
  <text class="name" x="640"  y="166">States</text>
  <text class="desc" x="640"  y="184">the missing states</text>
  <!-- 5 Evidence (opt-in, brass) -->
  <circle cx="783"  cy="118" r="20" fill="#C99645" fill-opacity="0.15" stroke="#C99645" stroke-width="2"/>
  <text class="num" x="783"  y="118" fill="#C99645">5</text>
  <text class="name" x="783"  y="166">Evidence</text>
  <text class="desc" x="783"  y="184" fill="#D6B778">opt-in · verified</text>
  <!-- 6 Revise -->
  <circle cx="925"  cy="118" r="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="2"/>
  <text class="num" x="925"  y="118" fill="#2DD4BF">6</text>
  <text class="name" x="925"  y="166">Revise</text>
  <text class="desc" x="925"  y="184">fold findings in</text>
  <!-- 7 ADRs -->
  <circle cx="1068" cy="118" r="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="2"/>
  <text class="num" x="1068" y="118" fill="#2DD4BF">7</text>
  <text class="name" x="1068" y="166">ADRs</text>
  <text class="desc" x="1068" y="184">decision records</text>
  <!-- 8 Iterate -->
  <circle cx="1210" cy="118" r="20" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="2"/>
  <text class="num" x="1210" y="118" fill="#2DD4BF">8</text>
  <text class="name" x="1210" y="166">Iterate</text>
  <text class="desc" x="1210" y="184">commit each step</text>

  <!-- iterate loop: 8 back to 3, with the user -->
  <path d="M1210 142 C 1210 250, 498 250, 498 142" fill="none" stroke="#C99645" stroke-width="1.6"
        stroke-dasharray="5 5" stroke-opacity="0.7" marker-end="url(#arwB)"/>
  <text class="loop" x="854" y="262">⟲  iterate with the user, one screen at a time</text>

  <!-- value props -->
  <text class="foot" x="640" y="300">principle-grounded  ·  state-complete  ·  evidence-honest  ·  decision-recorded  ·  human-in-the-loop</text>
</svg>
